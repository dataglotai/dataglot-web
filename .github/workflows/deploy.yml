name: Deploy dataglot.ai

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ZOLA_VERSION: v0.23.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
          zola --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: ./build.sh

      - name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1035895859653/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: dataglot-site-deployer@peaka-dataglot.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: ./deploy.sh
