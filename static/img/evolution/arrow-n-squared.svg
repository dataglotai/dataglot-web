<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Pre-Arrow N² converter mesh vs post-Arrow hub-and-spoke</title>

      
      <text x="200" y="40" text-anchor="middle" class="mono-t" font-size="11" letter-spacing="2" fill="#eef0fa" font-weight="700">BEFORE · N² CONVERTERS</text>
      <text x="200" y="58" text-anchor="middle" font-size="11" fill="#9aa3c0">every engine had its own in-memory layout</text>

      <g transform="translate(200, 220)">
        
        <g stroke="#ff6b81" stroke-width="1" fill="none" opacity="0.7">
          <line x1="0" y1="-100" x2="86.6" y2="-50"/>
          <line x1="0" y1="-100" x2="86.6" y2="50"/>
          <line x1="0" y1="-100" x2="0" y2="100"/>
          <line x1="0" y1="-100" x2="-86.6" y2="50"/>
          <line x1="0" y1="-100" x2="-86.6" y2="-50"/>

          <line x1="86.6" y1="-50" x2="86.6" y2="50"/>
          <line x1="86.6" y1="-50" x2="0" y2="100"/>
          <line x1="86.6" y1="-50" x2="-86.6" y2="50"/>
          <line x1="86.6" y1="-50" x2="-86.6" y2="-50"/>

          <line x1="86.6" y1="50" x2="0" y2="100"/>
          <line x1="86.6" y1="50" x2="-86.6" y2="50"/>
          <line x1="86.6" y1="50" x2="-86.6" y2="-50"/>

          <line x1="0" y1="100" x2="-86.6" y2="50"/>
          <line x1="0" y1="100" x2="-86.6" y2="-50"/>

          <line x1="-86.6" y1="50" x2="-86.6" y2="-50"/>
        </g>
        
        <g>
          <g transform="translate(0,-100)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Spark</text></g>
          <g transform="translate(86.6,-50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">pandas</text></g>
          <g transform="translate(86.6,50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">DB</text></g>
          <g transform="translate(0,100)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">DW</text></g>
          <g transform="translate(-86.6,50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">R</text></g>
          <g transform="translate(-86.6,-50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Java</text></g>
        </g>
      </g>

      <text x="200" y="370" text-anchor="middle" font-size="13" class="mono-t" fill="#ff6b81" font-weight="700">15 converters</text>
      <text x="200" y="390" text-anchor="middle" font-size="11" fill="#9aa3c0">serialize · deserialize tax at every boundary</text>

      
      <line x1="400" y1="80" x2="400" y2="380" stroke="#667090" stroke-width="0.5" stroke-dasharray="3 5"/>

      
      <text x="600" y="40" text-anchor="middle" class="mono-t" font-size="11" letter-spacing="2" fill="#eef0fa" font-weight="700">AFTER · ARROW IS THE STANDARD</text>
      <text x="600" y="58" text-anchor="middle" font-size="11" fill="#9aa3c0">one columnar in-memory format · zero copy</text>

      <g transform="translate(600, 220)">
        <g stroke="#2fd693" stroke-width="1.5" fill="none">
          <line x1="0" y1="0" x2="0" y2="-100"/>
          <line x1="0" y1="0" x2="86.6" y2="-50"/>
          <line x1="0" y1="0" x2="86.6" y2="50"/>
          <line x1="0" y1="0" x2="0" y2="100"/>
          <line x1="0" y1="0" x2="-86.6" y2="50"/>
          <line x1="0" y1="0" x2="-86.6" y2="-50"/>
        </g>
        
        <circle r="40" fill="rgba(47,214,147,0.18)" stroke="#2fd693" stroke-width="2"/>
        <text y="-2" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0fa">Arrow</text>
        <text y="14" text-anchor="middle" font-size="9" fill="#eef0fa" class="mono-t" letter-spacing="1">ZERO-COPY</text>
        
        <g>
          <g transform="translate(0,-100)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Spark</text></g>
          <g transform="translate(86.6,-50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">pandas</text></g>
          <g transform="translate(86.6,50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">DB</text></g>
          <g transform="translate(0,100)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">DW</text></g>
          <g transform="translate(-86.6,50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">R</text></g>
          <g transform="translate(-86.6,-50)"><circle r="22" fill="#141830" stroke="#667090"/><text y="4" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Java</text></g>
        </g>
      </g>

      <text x="600" y="370" text-anchor="middle" font-size="13" class="mono-t" fill="#2fd693" font-weight="700">6 adapters</text>
      <text x="600" y="390" text-anchor="middle" font-size="11" fill="#9aa3c0">no serialization across the boundary</text>
    </svg>