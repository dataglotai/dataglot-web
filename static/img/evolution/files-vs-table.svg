<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Four visual demonstrations of Hive Metastore failure modes</title>

      
      <g transform="translate(20, 20)">
        <text x="0" y="14" class="mono-t" font-size="10" letter-spacing="1.8" fill="#ff6b81" font-weight="700">PROBLEM 01 · O(n) PLANNING</text>

        
        <rect x="0" y="34" width="100" height="40" fill="#141830" stroke="#2c3352" stroke-width="1.5"/>
        <text x="50" y="59" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">query engine</text>

        
        <line x1="100" y1="54" x2="160" y2="54" stroke="#ff6b81" stroke-width="1.5"/>
        <polygon points="160,48 170,54 160,60" fill="#ff6b81"/>
        <text x="105" y="40" text-anchor="start" class="mono-t" font-size="9" fill="#ff6b81">LIST /table/</text>

        
        <rect x="170" y="20" width="180" height="140" fill="#141830" stroke="#2c3352" stroke-width="1.5"/>
        <text x="180" y="36" class="mono-t" font-size="9" fill="#9aa3c0" letter-spacing="1.5">S3://table/</text>
        <g class="mono-t" font-size="10">
          <text x="184" y="56" fill="#9aa3c0">  /year=2024/month=01/</text>
          <text x="184" y="74" fill="#9aa3c0">  /year=2024/month=02/</text>
          <text x="184" y="92" fill="#9aa3c0">  /year=2024/month=03/</text>
          <text x="184" y="110" fill="#9aa3c0">  /year=2024/month=04/</text>
          <text x="184" y="130" fill="#9aa3c0">  ...thousands more</text>
          <text x="184" y="148" fill="#9aa3c0">  ...millions of files</text>
        </g>

        
        <g transform="translate(380, 90)">
          <circle r="22" fill="#141830" stroke="#ff6b81" stroke-width="2"/>
          
          <line x1="0" y1="-17" x2="0" y2="-20" stroke="#ff6b81" stroke-width="1.5"/>
          <line x1="17" y1="0" x2="20" y2="0" stroke="#ff6b81" stroke-width="1.5"/>
          <line x1="0" y1="17" x2="0" y2="20" stroke="#ff6b81" stroke-width="1.5"/>
          <line x1="-17" y1="0" x2="-20" y2="0" stroke="#ff6b81" stroke-width="1.5"/>
          
          <line x1="0" y1="0" x2="0" y2="-12" stroke="#ff6b81" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="10" y2="5" stroke="#ff6b81" stroke-width="2" stroke-linecap="round"/>
          <circle r="2" fill="#ff6b81"/>
        </g>
        <text x="380" y="132" text-anchor="middle" class="mono-t" font-size="9" fill="#ff6b81" font-weight="700">WAIT…</text>

        
        <text x="0" y="190" font-size="11" fill="#9aa3c0">Every query <tspan font-weight="700" fill="#eef0fa">lists every directory</tspan> to know what to read.</text>
        <text x="0" y="206" font-size="11" fill="#9aa3c0">At petabyte scale, planning took longer than execution.</text>
      </g>

      
      <line x1="430" y1="20" x2="430" y2="240" stroke="#667090" stroke-width="0.5" stroke-dasharray="3 4"/>

      
      <g transform="translate(450, 20)">
        <text x="0" y="14" class="mono-t" font-size="10" letter-spacing="1.8" fill="#ff6b81" font-weight="700">PROBLEM 02 · NO ATOMIC COMMIT</text>

        
        <rect x="0" y="34" width="80" height="56" fill="#141830" stroke="#2c3352" stroke-width="1.5"/>
        <text x="40" y="68" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">writer</text>

        
        <line x1="80" y1="50" x2="170" y2="50" stroke="#667090" stroke-width="1.2"/>
        <polygon points="170,46 178,50 170,54" fill="#9aa3c0"/>
        <rect x="180" y="38" width="120" height="24" fill="rgba(47,214,147,0.18)" stroke="#2c3352"/>
        <text x="240" y="54" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">file_001.parquet</text>
        <text x="318" y="55" font-size="13" fill="#2fd693" font-weight="700">✓</text>

        
        <line x1="80" y1="74" x2="170" y2="74" stroke="#667090" stroke-width="1.2"/>
        <polygon points="170,70 178,74 170,78" fill="#9aa3c0"/>
        <rect x="180" y="62" width="60" height="24" fill="rgba(255,107,129,0.14)" stroke="#ff6b81" stroke-dasharray="3 2" stroke-width="1.2"/>
        <text x="210" y="78" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">file_002…</text>
        
        <text x="280" y="78" text-anchor="middle" class="mono-t" font-size="9" fill="#ff6b81" letter-spacing="1">[ missing ]</text>
        <text x="318" y="79" font-size="13" fill="#ff6b81" font-weight="700">✗</text>

        
        <rect x="0" y="116" width="330" height="52" fill="rgba(255,107,129,0.12)" stroke="#ff6b81" stroke-width="1.2" stroke-dasharray="3 3"/>
        <text x="14" y="138" class="mono-t" font-size="10" fill="#ff6b81" font-weight="700" letter-spacing="1">TABLE LEFT IN BROKEN STATE</text>
        <text x="14" y="156" font-size="11" fill="#eef0fa">readers see file_001 but not file_002 · no rollback</text>

        <text x="0" y="190" font-size="11" fill="#9aa3c0">Renaming a file isn't atomic on S3.</text>
        <text x="0" y="206" font-size="11" fill="#9aa3c0"><tspan font-weight="700" fill="#eef0fa">A failed write leaves half a table behind.</tspan></text>
      </g>

      
      <line x1="20" y1="270" x2="800" y2="270" stroke="#667090" stroke-width="0.5" stroke-dasharray="3 4"/>

      
      <g transform="translate(20, 290)">
        <text x="0" y="14" class="mono-t" font-size="10" letter-spacing="1.8" fill="#ff6b81" font-weight="700">PROBLEM 03 · BROKEN SCHEMA EVOLUTION</text>

        
        <g class="mono-t">
          <rect x="0" y="34" width="180" height="80" fill="#141830" stroke="#2c3352" stroke-width="1.2"/>
          <text x="14" y="52" font-size="9" fill="#9aa3c0" letter-spacing="1.2">file_old.parquet</text>
          <line x1="10" y1="60" x2="170" y2="60" stroke="#667090" stroke-width="0.4"/>
          <text x="14" y="80" font-size="11" fill="#9aa3c0">col: <tspan font-weight="700">customer_name</tspan></text>
          <text x="14" y="100" font-size="11" fill="#9aa3c0">col: amount</text>

          <rect x="200" y="34" width="180" height="80" fill="#141830" stroke="#2c3352" stroke-width="1.2"/>
          <text x="214" y="52" font-size="9" fill="#9aa3c0" letter-spacing="1.2">file_new.parquet</text>
          <line x1="210" y1="60" x2="370" y2="60" stroke="#667090" stroke-width="0.4"/>
          <text x="214" y="80" font-size="11" fill="#9aa3c0">col: <tspan font-weight="700" fill="#ff6b81">client_name</tspan></text>
          <text x="214" y="100" font-size="11" fill="#9aa3c0">col: amount</text>
        </g>

        
        <line x1="90" y1="118" x2="90" y2="138" stroke="#667090" stroke-width="1"/>
        <polygon points="86,134 90,142 94,134" fill="#9aa3c0"/>
        <line x1="290" y1="118" x2="290" y2="138" stroke="#667090" stroke-width="1"/>
        <polygon points="286,134 290,142 294,134" fill="#9aa3c0"/>

        
        <g transform="translate(0, 144)">
          <rect width="180" height="50" fill="rgba(47,214,147,0.10)" stroke="#2fd693" stroke-width="1.2"/>
          <text x="90" y="22" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Reader A · expects</text>
          <text x="90" y="38" text-anchor="middle" class="mono-t" font-size="11" font-weight="700" fill="#eef0fa">customer_name</text>
          <text x="160" y="32" font-size="14" fill="#2fd693" font-weight="700">✓</text>
        </g>
        <g transform="translate(200, 144)">
          <rect width="180" height="50" fill="rgba(255,107,129,0.12)" stroke="#ff6b81" stroke-width="1.2"/>
          <text x="90" y="22" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Reader B · expects</text>
          <text x="90" y="38" text-anchor="middle" class="mono-t" font-size="11" font-weight="700" fill="#eef0fa">customer_name</text>
          <text x="160" y="32" font-size="14" fill="#ff6b81" font-weight="700">✗</text>
        </g>

        <text x="0" y="222" font-size="11" fill="#9aa3c0">Renaming a column = coin flip.</text>
        <text x="0" y="238" font-size="11" fill="#9aa3c0"><tspan font-weight="700" fill="#eef0fa">Some readers got the new name. Some failed.</tspan></text>
      </g>

      
      <line x1="430" y1="290" x2="430" y2="530" stroke="#667090" stroke-width="0.5" stroke-dasharray="3 4"/>

      
      <g transform="translate(450, 290)">
        <text x="0" y="14" class="mono-t" font-size="10" letter-spacing="1.8" fill="#ff6b81" font-weight="700">PROBLEM 04 · CONCURRENT WRITERS</text>

        
        <rect x="0" y="34" width="100" height="40" fill="#141830" stroke="#2c3352" stroke-width="1.2"/>
        <text x="50" y="59" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Writer A</text>

        
        <rect x="240" y="34" width="100" height="40" fill="#141830" stroke="#2c3352" stroke-width="1.2"/>
        <text x="290" y="59" text-anchor="middle" class="mono-t" font-size="11" fill="#9aa3c0">Writer B</text>

        
        <line x1="100" y1="64" x2="155" y2="118" stroke="#ff6b81" stroke-width="1.5"/>
        <polygon points="158,114 162,124 152,120" fill="#ff6b81"/>
        <line x1="240" y1="64" x2="185" y2="118" stroke="#ff6b81" stroke-width="1.5"/>
        <polygon points="182,114 178,124 188,120" fill="#ff6b81"/>

        
        <text x="170" y="100" text-anchor="middle" font-size="22" fill="#f5b83d" font-weight="900">⚡</text>

        
        <rect x="80" y="124" width="180" height="56" fill="rgba(255,107,129,0.14)" stroke="#ff6b81" stroke-width="1.5"/>
        <text x="170" y="146" text-anchor="middle" class="mono-t" font-size="11" fill="#ff6b81" font-weight="700">shared table</text>
        <text x="170" y="166" text-anchor="middle" class="mono-t" font-size="10" fill="#eef0fa">A's writes overwritten by B</text>

        <text x="0" y="222" font-size="11" fill="#9aa3c0">No locks. No coordination. No safe concurrency.</text>
        <text x="0" y="238" font-size="11" fill="#9aa3c0"><tspan font-weight="700" fill="#eef0fa">Production teams added locks and prayers.</tspan></text>
      </g>
    </svg>