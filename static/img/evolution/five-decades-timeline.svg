        <line x1="680" y1="180" x2="680" y2="240" stroke="#2fd693" stroke-width="1.5"/>
        <circle cx="680" cy="180" r="5" fill="#2fd693"/>
        <text x="695" y="244" font-size="11" font-weight="700" fill="#eef0fa">Arrow</text>
        <text x="695" y="257" font-size="10" class="mono-t" fill="#9aa3c0">in-memory standard · 2016</text>

        
        <line x1="710" y1="180" x2="710" y2="280" stroke="#f5b83d" stroke-width="2"/>
        <circle cx="710" cy="180" r="6" fill="#f5b83d" stroke="#667090"/>
        <text x="725" y="284" font-size="11" font-weight="700" fill="#eef0fa">Iceberg</text>
        <text x="725" y="297" font-size="10" class="mono-t" fill="#9aa3c0">open lakehouse · 2017</text>

        
        <line x1="780" y1="180" x2="780" y2="320" stroke="#667090" stroke-width="1"/>
        <circle cx="780" cy="180" r="4" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
        <text x="795" y="324" font-size="11" font-weight="700" fill="#eef0fa">Iceberg top-level</text>
        <text x="795" y="337" font-size="10" class="mono-t" fill="#9aa3c0">Apache · 2020</text>
