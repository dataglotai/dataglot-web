<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>A horizontal timeline of major data ecosystem events</title>

      
      <line x1="60" y1="180" x2="940" y2="180" stroke="#667090" stroke-width="2"/>

      
      <g class="mono-t" font-size="10" fill="#9aa3c0" text-anchor="middle">
        <line x1="60" y1="174" x2="60" y2="186" stroke="#667090"/>
        <text x="60" y="206">1970</text>
        <line x1="200" y1="174" x2="200" y2="186" stroke="#667090"/>
        <text x="200" y="206">1990</text>
        <line x1="340" y1="174" x2="340" y2="186" stroke="#667090"/>
        <text x="340" y="206">2000</text>
        <line x1="480" y1="174" x2="480" y2="186" stroke="#667090"/>
        <text x="480" y="206">2010</text>
        <line x1="620" y1="174" x2="620" y2="186" stroke="#667090"/>
        <text x="620" y="206">2015</text>
        <line x1="760" y1="174" x2="760" y2="186" stroke="#667090"/>
        <text x="760" y="206">2020</text>
        <line x1="900" y1="174" x2="900" y2="186" stroke="#667090"/>
        <text x="900" y="206">today</text>
      </g>

      
      <g>
        
        <line x1="65" y1="180" x2="65" y2="100" stroke="#667090" stroke-width="1"/>
        <circle cx="65" cy="180" r="4" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
        <text x="80" y="105" font-size="11" font-weight="700" fill="#eef0fa">Relational model</text>
        <text x="80" y="118" font-size="10" class="mono-t" fill="#9aa3c0">Codd · 1970</text>

        
        <line x1="225" y1="180" x2="225" y2="80" stroke="#2fd693" stroke-width="1.5"/>
        <circle cx="225" cy="180" r="5" fill="#2fd693"/>
        <text x="240" y="85" font-size="11" font-weight="700" fill="#eef0fa">Sybase IQ</text>
        <text x="240" y="98" font-size="10" class="mono-t" fill="#9aa3c0">columnar pioneer · 1994</text>

        
        <line x1="410" y1="180" x2="410" y2="60" stroke="#0878FF" stroke-width="1.5"/>
        <circle cx="410" cy="180" r="5" fill="#0878FF"/>
        <text x="425" y="65" font-size="11" font-weight="700" fill="#eef0fa">S3 + Hadoop</text>
        <text x="425" y="78" font-size="10" class="mono-t" fill="#9aa3c0">storage + scale · 2006</text>

        
        <line x1="480" y1="180" x2="480" y2="120" stroke="#ff6b81" stroke-width="1.5"/>
        <circle cx="480" cy="180" r="5" fill="#ff6b81"/>
        <text x="495" y="125" font-size="11" font-weight="700" fill="#eef0fa">Spark</text>
        <text x="495" y="138" font-size="10" class="mono-t" fill="#9aa3c0">2010</text>

        
        <line x1="600" y1="180" x2="600" y2="60" stroke="#667090" stroke-width="1"/>
        <circle cx="600" cy="180" r="4" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
        <text x="615" y="65" font-size="11" font-weight="700" fill="#eef0fa">Snowflake GA</text>
        <text x="615" y="78" font-size="10" class="mono-t" fill="#9aa3c0">three layers · 2014</text>
      </g>

      
      <g>
        
        <line x1="445" y1="180" x2="445" y2="240" stroke="#667090" stroke-width="1"/>
