      <text x="60" y="40" font-size="10" class="mono-t" letter-spacing="2" fill="#9aa3c0">DATABASE ERA</text>
      <text x="940" y="40" text-anchor="end" font-size="10" class="mono-t" letter-spacing="2" fill="#9aa3c0">OPEN LAKEHOUSE</text>
      <line x1="60" y1="48" x2="940" y2="48" stroke="#667090" stroke-width="0.5" stroke-dasharray="2 4"/>
