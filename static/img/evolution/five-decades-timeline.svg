        <line x1="540" y1="180" x2="540" y2="280" stroke="#667090" stroke-width="1"/>
        <circle cx="540" cy="180" r="4" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
        <text x="555" y="284" font-size="11" font-weight="700" fill="#eef0fa">Redshift · Spark</text>
        <text x="555" y="297" font-size="10" class="mono-t" fill="#9aa3c0">2012</text>

        
        <line x1="570" y1="180" x2="570" y2="320" stroke="#0878FF" stroke-width="1.5"/>
