<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>The Iceberg metadata hierarchy</title>

      
      <g transform="translate(40, 40)">
        <rect width="180" height="60" fill="rgba(47,214,147,0.16)"/>
        <text x="90" y="26" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#f5b83d">ROOT POINTER</text>
        <text x="90" y="48" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0fa">metadata.json</text>
      </g>
      <text x="40" y="120" font-size="11" fill="#9aa3c0">→ catalog stores ONE pointer per table</text>
      <text x="40" y="136" font-size="11" fill="#9aa3c0">→ commit = atomic swap of this pointer</text>

      
      <line x1="220" y1="70" x2="280" y2="70" stroke="#667090" stroke-width="1.5"/>
      <polygon points="280,64 290,70 280,76" fill="#9aa3c0"/>

      
      <g transform="translate(290, 40)">
        <rect width="180" height="60" fill="rgba(47,214,147,0.18)" stroke="#2c3352"/>
        <text x="90" y="26" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">MANIFEST LIST</text>
        <text x="90" y="48" text-anchor="middle" class="mono-t" font-size="13" font-weight="700" fill="#eef0fa">snapshot · 2024-04-12</text>
      </g>

      
      <g stroke="#667090" stroke-width="1.5" fill="none">
        <path d="M 470 70 L 540 70"/>
        <path d="M 470 70 L 540 140"/>
        <path d="M 470 70 L 540 210"/>
      </g>
      <g fill="#9aa3c0">
        <polygon points="540,64 550,70 540,76"/>
        <polygon points="540,134 550,140 540,146"/>
        <polygon points="540,204 550,210 540,216"/>
      </g>

      
      <g class="mono-t">
        <g transform="translate(550, 40)">
          <rect width="180" height="60" fill="rgba(8,120,255,0.18)" stroke="#2c3352"/>
          <text x="90" y="26" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#9aa3c0">MANIFEST 01</text>
          <text x="90" y="48" text-anchor="middle" font-size="11" fill="#9aa3c0">file index · stats</text>
        </g>
        <g transform="translate(550, 110)">
          <rect width="180" height="60" fill="rgba(8,120,255,0.18)" stroke="#2c3352"/>
          <text x="90" y="26" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#9aa3c0">MANIFEST 02</text>
          <text x="90" y="48" text-anchor="middle" font-size="11" fill="#9aa3c0">file index · stats</text>
        </g>
        <g transform="translate(550, 180)">
          <rect width="180" height="60" fill="rgba(8,120,255,0.18)" stroke="#2c3352"/>
          <text x="90" y="26" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="#9aa3c0">MANIFEST 03</text>
          <text x="90" y="48" text-anchor="middle" font-size="11" fill="#9aa3c0">file index · stats</text>
        </g>
      </g>

      
      <g transform="translate(40, 280)">
        <text x="0" y="0" class="mono-t" font-size="10" letter-spacing="2" fill="#9aa3c0">DATA LAYER · IMMUTABLE PARQUET</text>
        <g class="mono-t">
          <rect x="0" y="14" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="60" y="38" text-anchor="middle" font-size="11" fill="#eef0fa">file_001.parquet</text>
          <rect x="130" y="14" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="190" y="38" text-anchor="middle" font-size="11" fill="#eef0fa">file_002.parquet</text>
          <rect x="260" y="14" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="320" y="38" text-anchor="middle" font-size="11" fill="#eef0fa">file_003.parquet</text>
          <rect x="390" y="14" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="450" y="38" text-anchor="middle" font-size="11" fill="#eef0fa">file_004.parquet</text>
          <rect x="520" y="14" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="580" y="38" text-anchor="middle" font-size="11" fill="#eef0fa">file_005.parquet</text>
        </g>
      </g>

      
      <g transform="translate(40, 170)">
        <rect width="290" height="80" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
        <text x="20" y="26" class="mono-t" font-size="10" letter-spacing="2" fill="#f5b83d" font-weight="700">COMMIT</text>
        <text x="20" y="48" font-size="13" fill="#eef0fa">Write new files → write new manifests → swap</text>
        <text x="20" y="66" font-size="13" fill="#eef0fa">root pointer atomically. That's the entire trick.</text>
      </g>
    </svg>