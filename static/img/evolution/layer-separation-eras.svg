<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Five eras showing how Catalog, Compute, Storage are arranged in each</title>

      <g>
        
        <g transform="translate(40, 60)">
          <text x="80" y="-12" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">1970–1990s</text>
          <text x="80" y="2" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0fa">Database</text>
          <rect x="20" y="20" width="120" height="36" fill="rgba(47,214,147,0.16)"/>
          <text x="80" y="44" text-anchor="middle" font-size="11" fill="#eef0fa">CAT</text>
          <rect x="20" y="58" width="120" height="36" fill="rgba(255,107,129,0.16)"/>
          <text x="80" y="82" text-anchor="middle" font-size="11" fill="#eef0fa">COMP</text>
          <rect x="20" y="96" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
          <text x="80" y="120" text-anchor="middle" font-size="11" fill="#eef0fa">STOR</text>
          <text x="80" y="160" text-anchor="middle" font-size="10" fill="#9aa3c0">all bundled</text>
        </g>

        
        <g transform="translate(220, 60)">
          <text x="80" y="-12" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">1994–2005</text>
          <text x="80" y="2" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0fa">DB + Warehouse</text>

          <g transform="translate(0,20)">
            <rect width="70" height="36" fill="rgba(47,214,147,0.16)"/>
            <text x="35" y="24" text-anchor="middle" font-size="10" fill="#eef0fa">CAT</text>
            <rect y="38" width="70" height="36" fill="rgba(255,107,129,0.16)"/>
            <text x="35" y="62" text-anchor="middle" font-size="10" fill="#eef0fa">COMP</text>
            <rect y="76" width="70" height="36" fill="rgba(8,120,255,0.18)"/>
            <text x="35" y="100" text-anchor="middle" font-size="10" fill="#eef0fa">STOR</text>
          </g>
          <g transform="translate(90,20)">
            <rect width="70" height="36" fill="rgba(47,214,147,0.16)"/>
            <text x="35" y="24" text-anchor="middle" font-size="10" fill="#eef0fa">CAT</text>
            <rect y="38" width="70" height="36" fill="rgba(255,107,129,0.16)"/>
            <text x="35" y="62" text-anchor="middle" font-size="10" fill="#eef0fa">COMP</text>
            <rect y="76" width="70" height="36" fill="rgba(8,120,255,0.18)"/>
            <text x="35" y="100" text-anchor="middle" font-size="10" fill="#eef0fa">STOR</text>
          </g>
          <text x="80" y="160" text-anchor="middle" font-size="10" fill="#9aa3c0">two bundled stacks</text>
        </g>

        
        <g transform="translate(420, 60)">
          <text x="80" y="-12" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">2006–2014</text>
          <text x="80" y="2" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0fa">Data Lake</text>
          <g transform="translate(20,20)">
            <rect width="120" height="36" fill="rgba(255,107,129,0.16)"/>
            <text x="60" y="24" text-anchor="middle" font-size="11" fill="#eef0fa">COMP (Spark)</text>
            <rect y="50" width="120" height="36" fill="rgba(8,120,255,0.18)"/>
            <text x="60" y="74" text-anchor="middle" font-size="11" fill="#eef0fa">STOR (S3)</text>
            <rect y="100" width="120" height="20" fill="#141830" stroke="#2c3352" stroke-dasharray="2 2"/>
            <text x="60" y="114" text-anchor="middle" font-size="9" class="mono-t" fill="#ff6b81">no real catalog</text>
          </g>
          <text x="80" y="160" text-anchor="middle" font-size="10" fill="#9aa3c0">decoupled · fragile</text>
        </g>

        
        <g transform="translate(600, 60)">
          <text x="80" y="-12" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">2014</text>
          <text x="80" y="2" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0fa">Cloud Warehouse</text>
          <g transform="translate(20,20)">
            <rect width="120" height="30" fill="rgba(47,214,147,0.16)"/>
            <text x="60" y="20" text-anchor="middle" font-size="10" fill="#eef0fa">CAT (managed)</text>
            <rect y="36" width="120" height="30" fill="rgba(255,107,129,0.16)"/>
            <text x="60" y="56" text-anchor="middle" font-size="10" fill="#eef0fa">COMP (elastic)</text>
            <rect y="72" width="120" height="30" fill="rgba(8,120,255,0.18)"/>
            <text x="60" y="92" text-anchor="middle" font-size="10" fill="#eef0fa">STOR (S3)</text>
          </g>
          <text x="80" y="160" text-anchor="middle" font-size="10" fill="#9aa3c0">three layers · closed</text>
        </g>

        
        <g transform="translate(800, 60)">
          <text x="80" y="-12" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="1.5" fill="#9aa3c0">today</text>
          <text x="80" y="2" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0fa">Open Lakehouse</text>
          <g transform="translate(20,20)">
            <rect width="120" height="30" fill="rgba(47,214,147,0.16)"/>
            <text x="60" y="20" text-anchor="middle" font-size="10" fill="#eef0fa">CAT (Iceberg REST)</text>
            <rect y="36" width="120" height="30" fill="rgba(255,107,129,0.16)"/>
            <text x="60" y="56" text-anchor="middle" font-size="10" fill="#eef0fa">COMP (any engine)</text>
            <rect y="72" width="120" height="30" fill="rgba(8,120,255,0.18)"/>
            <text x="60" y="92" text-anchor="middle" font-size="10" fill="#eef0fa">STOR (object)</text>
          </g>
          <text x="80" y="160" text-anchor="middle" font-size="10" fill="#9aa3c0">three layers · open</text>
        </g>
      </g>

      
      <g stroke="#667090" stroke-width="1" fill="none">
        <path d="M 200 130 L 220 130"/>
        <path d="M 400 130 L 420 130"/>
        <path d="M 580 130 L 600 130"/>
        <path d="M 780 130 L 800 130"/>
      </g>
      <g fill="#9aa3c0">
        <polygon points="220,124 230,130 220,136"/>
        <polygon points="420,124 430,130 420,136"/>
        <polygon points="600,124 610,130 600,136"/>
        <polygon points="800,124 810,130 800,136"/>
      </g>
    </svg>