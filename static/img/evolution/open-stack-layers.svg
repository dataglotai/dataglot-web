<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>The six-layer modern open lakehouse architecture</title>

      <g class="serif-t">
        
        <g transform="translate(40, 30)">
          <rect width="720" height="60" fill="rgba(255,107,129,0.16)"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">COMPUTE</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">any engine that speaks the spec</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">Spark · DuckDB · Dataglot · Snowflake</text>
        </g>

        
        <g transform="translate(40, 100)">
          <rect width="720" height="60" fill="rgba(47,214,147,0.16)"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">IN-MEMORY</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">Apache Arrow</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">zero-copy · vectorized · cross-language</text>
        </g>

        
        <g transform="translate(40, 170)">
          <rect width="720" height="60" fill="rgba(47,214,147,0.16)" opacity="0.85"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">CATALOG</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">REST catalogs · open specs</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">Iceberg REST · Polaris · Lakekeeper</text>
        </g>

        
        <g transform="translate(40, 240)">
          <rect width="720" height="60" fill="rgba(8,120,255,0.18)" opacity="0.95"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">TABLE FORMAT</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">Apache Iceberg</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">ACID · time travel · schema evolution</text>
        </g>

        
        <g transform="translate(40, 310)">
          <rect width="720" height="60" fill="rgba(8,120,255,0.18)" opacity="0.78"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">FILE FORMAT</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">Apache Parquet</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">columnar · compressed · self-describing</text>
        </g>

        
        <g transform="translate(40, 380)">
          <rect width="720" height="60" fill="rgba(8,120,255,0.18)" opacity="0.6"/>
          <text x="20" y="22" class="mono-t" font-size="10" letter-spacing="2" fill="#eef0fa" font-weight="700">STORAGE</text>
          <text x="20" y="42" font-size="15" font-weight="700" fill="#eef0fa">object storage</text>
          <text x="20" y="56" font-size="11" fill="#eef0fa" class="mono-t">S3 · GCS · ADLS · MinIO</text>
        </g>
      </g>
    </svg>