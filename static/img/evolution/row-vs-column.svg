<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Row store wastes most of the read; column store reads only what's needed</title>
      
      <text x="160" y="32" text-anchor="middle" class="mono-t" font-size="11" letter-spacing="2" fill="#eef0fa">ROW STORE · READS EVERYTHING</text>

      <g transform="translate(40, 50)">
        
        <g>
          <rect x="0" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <rect x="60" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <rect x="120" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <rect x="180" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <text x="30" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">id</text>
          <text x="90" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">name</text>
          <text x="150" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#ff6b81" font-weight="700">region</text>
          <text x="210" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#ff6b81" font-weight="700">amount</text>
        </g>
        
        <g>
          
          <rect x="0" y="32" width="240" height="28" fill="rgba(255,107,129,0.18)" stroke="#2c3352"/>
          <line x1="60" y1="32" x2="60" y2="60" stroke="#667090"/>
          <line x1="120" y1="32" x2="120" y2="60" stroke="#667090"/>
          <line x1="180" y1="32" x2="180" y2="60" stroke="#667090"/>
          <text x="30" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">001</text>
          <text x="90" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">Acme</text>
          <text x="150" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">EU</text>
          <text x="210" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$420</text>

          <rect x="0" y="64" width="240" height="28" fill="rgba(255,107,129,0.18)" stroke="#2c3352"/>
          <line x1="60" y1="64" x2="60" y2="92" stroke="#667090"/>
          <line x1="120" y1="64" x2="120" y2="92" stroke="#667090"/>
          <line x1="180" y1="64" x2="180" y2="92" stroke="#667090"/>
          <text x="30" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">002</text>
          <text x="90" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">Bolt</text>
          <text x="150" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">US</text>
          <text x="210" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$110</text>

          <rect x="0" y="96" width="240" height="28" fill="rgba(255,107,129,0.18)" stroke="#2c3352"/>
          <line x1="60" y1="96" x2="60" y2="124" stroke="#667090"/>
          <line x1="120" y1="96" x2="120" y2="124" stroke="#667090"/>
          <line x1="180" y1="96" x2="180" y2="124" stroke="#667090"/>
          <text x="30" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">003</text>
          <text x="90" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">Cog</text>
          <text x="150" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">APAC</text>
          <text x="210" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$888</text>

          <rect x="0" y="128" width="240" height="28" fill="rgba(255,107,129,0.18)" stroke="#2c3352"/>
          <line x1="60" y1="128" x2="60" y2="156" stroke="#667090"/>
          <line x1="120" y1="128" x2="120" y2="156" stroke="#667090"/>
          <line x1="180" y1="128" x2="180" y2="156" stroke="#667090"/>
          <text x="30" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
          <text x="90" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
          <text x="150" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
          <text x="210" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
        </g>
      </g>

      
      <g transform="translate(380, 130)">
        <text text-anchor="middle" class="serif-t" font-size="42" font-weight="900" fill="#ff6b81">→</text>
        <text y="40" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" letter-spacing="1.5">SAME QUERY</text>
      </g>

      
      <text x="600" y="32" text-anchor="middle" class="mono-t" font-size="11" letter-spacing="2" fill="#eef0fa">COLUMN STORE · READS ONLY 2/4</text>

      <g transform="translate(480, 50)">
        <g>
          <rect x="0" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <rect x="60" y="0" width="60" height="28" fill="#1a1f3a" stroke="#2c3352"/>
          <rect x="120" y="0" width="60" height="28" fill="rgba(47,214,147,0.25)" stroke="#2c3352"/>
          <rect x="180" y="0" width="60" height="28" fill="rgba(47,214,147,0.25)" stroke="#2c3352"/>
          <text x="30" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">id</text>
          <text x="90" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">name</text>
          <text x="150" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#2fd693" font-weight="700">region</text>
          <text x="210" y="18" text-anchor="middle" class="mono-t" font-size="10" fill="#2fd693" font-weight="700">amount</text>
        </g>
        
        <g>
          <rect x="0" y="32" width="120" height="124" fill="#1a1f3a" stroke="#2c3352" opacity="0.5"/>
          <rect x="120" y="32" width="120" height="124" fill="rgba(47,214,147,0.25)" stroke="#2c3352"/>
          <line x1="60" y1="32" x2="60" y2="156" stroke="#667090" opacity="0.4"/>
          <line x1="180" y1="32" x2="180" y2="156" stroke="#667090"/>

          <text x="30" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">001</text>
          <text x="90" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">Acme</text>
          <text x="150" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">EU</text>
          <text x="210" y="50" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$420</text>

          <text x="30" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">002</text>
          <text x="90" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">Bolt</text>
          <text x="150" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">US</text>
          <text x="210" y="82" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$110</text>

          <text x="30" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">003</text>
          <text x="90" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">Cog</text>
          <text x="150" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">APAC</text>
          <text x="210" y="114" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">$888</text>

          <text x="30" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">…</text>
          <text x="90" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" opacity="0.5">…</text>
          <text x="150" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
          <text x="210" y="146" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">…</text>
        </g>
      </g>

      
      <text x="160" y="220" text-anchor="middle" class="mono-t" font-size="11" fill="#ff6b81" font-weight="700">100% read</text>
      <text x="160" y="238" text-anchor="middle" font-size="11" fill="#9aa3c0">all rows · all columns</text>
      <text x="600" y="220" text-anchor="middle" class="mono-t" font-size="11" fill="#2fd693" font-weight="700">50% read · &gt;10× compressed</text>
      <text x="600" y="238" text-anchor="middle" font-size="11" fill="#9aa3c0">only the columns you need</text>

      
      <g transform="translate(380, 270)">
        <text text-anchor="middle" class="mono-t" font-size="11" letter-spacing="1.5" fill="#eef0fa">YOU CAN'T INDEX YOUR WAY OUT.</text>
        <text y="20" text-anchor="middle" font-size="11" fill="#9aa3c0">More indexes mean slower writes. The shape of storage has to change.</text>
      </g>
    </svg>