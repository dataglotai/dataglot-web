<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Storage cost dropping steeply with the arrival of S3</title>
      
      <line x1="80" y1="60" x2="80" y2="280" stroke="#667090"/>
      <line x1="80" y1="280" x2="720" y2="280" stroke="#667090"/>

      
      <text x="68" y="64" text-anchor="end" class="mono-t" font-size="10" fill="#9aa3c0">$$$$</text>
      <text x="68" y="124" text-anchor="end" class="mono-t" font-size="10" fill="#9aa3c0">$$$</text>
      <text x="68" y="184" text-anchor="end" class="mono-t" font-size="10" fill="#9aa3c0">$$</text>
      <text x="68" y="244" text-anchor="end" class="mono-t" font-size="10" fill="#9aa3c0">$</text>

      
      <text x="160" y="298" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">1990</text>
      <text x="320" y="298" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">2000</text>
      <text x="480" y="298" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0" font-weight="700">2006</text>
      <text x="640" y="298" text-anchor="middle" class="mono-t" font-size="10" fill="#9aa3c0">today</text>

      
      <path d="M 100 90 L 320 130 L 480 195" fill="none" stroke="#667090" stroke-width="2"/>

      
      <path d="M 480 195 L 500 245 L 720 258" fill="none" stroke="#ff6b81" stroke-width="2.5"/>

      
      <circle cx="480" cy="195" r="5" fill="#ff6b81"/>
      <circle cx="500" cy="245" r="5" fill="#ff6b81"/>
      <line x1="480" y1="195" x2="480" y2="60" stroke="#ff6b81" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="490" y="55" class="mono-t" font-size="11" fill="#ff6b81" font-weight="700">S3 LAUNCH · 2006</text>

      
      <text x="170" y="70" font-size="11" fill="#9aa3c0">tape · disk arrays · SAN · NAS</text>
      <text x="170" y="86" font-size="11" fill="#9aa3c0">on-prem capex · per-TB enterprise pricing</text>

      <text x="540" y="225" font-size="11" fill="#eef0fa" font-weight="600">~$0.023 / GB-month</text>
      <text x="540" y="241" font-size="11" fill="#9aa3c0">11 nines durability · pay only for what you use</text>

      
      <text x="40" y="170" font-size="11" class="mono-t" fill="#9aa3c0" letter-spacing="2" transform="rotate(-90, 40, 170)">COST PER GB</text>

      
      <rect x="80" y="320" width="640" height="30" fill="#141830" stroke="#2c3352" stroke-dasharray="2 2"/>
      <text x="100" y="340" font-size="11" fill="#9aa3c0"><tspan font-weight="700" fill="#ff6b81" class="mono-t" letter-spacing="1.5">CATCH:</tspan>  Built for objects, not databases. High latency per request. No transactions. No random writes.</text>
    </svg>