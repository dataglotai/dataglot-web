<?xml version="1.0" ?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.mono-t{font-family:ui-monospace,Menlo,Consolas,monospace}</style><rect x="-10000" y="-10000" width="30000" height="30000" fill="#0e1120"/>
      <title>Various data shapes flowing toward a rigid warehouse, most bouncing off</title>

      
      <g transform="translate(40, 40)">
        <text x="0" y="0" class="mono-t" font-size="10" letter-spacing="2" fill="#9aa3c0">NEW DATA SHAPES</text>

        
        <g class="serif-t">
          <rect x="0" y="16" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="60" y="40" text-anchor="middle" font-size="13" fill="#eef0fa">JSON</text>

          <rect x="130" y="16" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="190" y="40" text-anchor="middle" font-size="13" fill="#eef0fa">CSV / partner files</text>

          <rect x="0" y="64" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="60" y="88" text-anchor="middle" font-size="13" fill="#eef0fa">clickstream</text>

          <rect x="130" y="64" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="190" y="88" text-anchor="middle" font-size="13" fill="#eef0fa">app logs</text>

          <rect x="0" y="112" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="60" y="136" text-anchor="middle" font-size="13" fill="#eef0fa">images</text>

          <rect x="130" y="112" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="190" y="136" text-anchor="middle" font-size="13" fill="#eef0fa">video</text>

          <rect x="0" y="160" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="60" y="184" text-anchor="middle" font-size="13" fill="#eef0fa">sensor</text>

          <rect x="130" y="160" width="120" height="40" fill="#141830" stroke="#2c3352"/>
          <text x="190" y="184" text-anchor="middle" font-size="13" fill="#eef0fa">events</text>
        </g>
      </g>

      
      <g stroke="#667090" stroke-width="1" fill="none">
        <path d="M 300 80  C 380 90, 440 110, 500 135"/>
        <path d="M 300 130 C 380 130, 440 140, 500 150"/>
        <path d="M 300 180 C 380 175, 440 175, 500 175"/>
        <path d="M 300 230 C 380 220, 440 200, 500 195"/>
      </g>

      
      <g stroke="#ff6b81" stroke-width="1.2" fill="none" stroke-dasharray="3 4">
        <path d="M 500 135 C 460 80, 400 60, 320 70"/>
        <path d="M 500 195 C 460 230, 400 250, 320 240"/>
      </g>
      <g fill="#ff6b81">
        <polygon points="320,70 330,66 330,76"/>
        <polygon points="320,240 330,236 330,246"/>
      </g>

      
      <g transform="translate(540, 60)">
        <rect width="220" height="220" fill="#141830" stroke="#2c3352" stroke-width="2"/>
        <text x="110" y="32" text-anchor="middle" class="mono-t" font-size="10" letter-spacing="2" fill="#9aa3c0">DATA WAREHOUSE</text>

        
        <rect x="35" y="50" width="150" height="120" fill="none" stroke="#2c3352" stroke-width="2" stroke-dasharray="4 3"/>
        <text x="110" y="85" text-anchor="middle" class="serif-t" font-size="14" font-weight="700" fill="#eef0fa">SCHEMA</text>
        <text x="110" y="105" text-anchor="middle" class="serif-t" font-size="14" font-weight="700" fill="#eef0fa">ON-WRITE</text>
        <text x="110" y="135" text-anchor="middle" font-size="11" fill="#9aa3c0">define first.</text>
        <text x="110" y="150" text-anchor="middle" font-size="11" fill="#9aa3c0">load second.</text>

        <text x="110" y="200" text-anchor="middle" class="mono-t" font-size="10" fill="#ff6b81" font-weight="700">REJECTS THE MESS</text>
      </g>

      
      <rect x="40" y="310" width="720" height="50" fill="#060810" stroke="#2c3352" stroke-width="1.5"/>
      <text x="60" y="340" font-size="13" fill="#f5b83d" class="mono-t" letter-spacing="2" font-weight="700">CONCLUSION</text>
      <text x="180" y="340" font-size="13" fill="#eef0fa">We needed somewhere to put it all — before we knew what it was.</text>
    </svg>